<style>
:root{
  --paper:#FAF8F3;--card:#fff;--ink:#1E2230;--muted:#6E7281;--line:#E8E3D7;--rule:#EEF0F6;
  --red:#D9443A;--red-soft:#FDECEA;--green:#2B9465;--green-soft:#E6F4EC;
  --ind:#3346B8;--ind-soft:#ECEFFC;--hl:#FFE680;--r:16px
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;line-height:1.7}
button{font:inherit;cursor:pointer;color:inherit}
input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{line-height:1.35;margin:0}
.wrap{max-width:780px;margin:0 auto;padding:20px 16px 60px}
[hidden]{display:none!important}

/* header */
header.top{position:sticky;top:0;z-index:10;background:rgba(250,248,243,.93);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px 6px;max-width:780px;margin:0 auto}
.logo{font-family:'Reem Kufi',sans-serif;font-weight:700;font-size:1.4rem;display:flex;align-items:center;gap:4px;background:none;border:0;padding:0}
.ring{position:relative;color:var(--red);padding:0 6px}
.ring svg{position:absolute;inset:-5px -6px;width:calc(100% + 12px);height:calc(100% + 10px);pointer-events:none}
.ring path,.mark path{fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;vector-effect:non-scaling-stroke}
.who{display:flex;align-items:center;gap:8px}
.pts{font-weight:700;font-size:.88rem;background:var(--hl);padding:2px 12px;border-radius:999px;white-space:nowrap}
.namebtn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:2px 12px;font-size:.85rem;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding:2px 16px 10px;max-width:780px;margin:0 auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:0;background:none;color:var(--muted);padding:6px 12px;border-radius:999px;font-size:.9rem;font-weight:500}
.tab.on{background:var(--ink);color:#fff}

/* generic */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.btn{border:0;background:var(--ind);color:#fff;padding:11px 20px;border-radius:12px;font-weight:600}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.dark{background:var(--ink)}
.btn.sm{padding:7px 14px;font-size:.88rem}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.chip{display:inline-block;font-size:.8rem;font-weight:600;background:var(--ind-soft);color:var(--ind);padding:2px 10px;border-radius:999px}
.chip.week{background:#FFF4C2;color:#7A5B00}
.field{display:block;width:100%;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px}
.field:focus,.ans:focus{outline:none;border-color:var(--ind)}
label.lb{display:block;font-size:.88rem;font-weight:600;margin:12px 0 4px}
.sec-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:28px 0 12px}
.sec-title h2{font-size:1.15rem}

/* math */
.m{display:inline-block;unicode-bidi:isolate;direction:ltr;white-space:nowrap}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.82em;line-height:1.15;margin:0 2px}
.fr>span:first-child{border-bottom:1.5px solid currentColor;padding:0 3px}

/* home */
.hero{text-align:center;padding:26px 0 8px}
.appicon{display:block;width:92px;height:92px;margin:0 auto 14px;border-radius:22px;box-shadow:0 6px 18px rgba(30,34,48,.12),0 0 0 1px var(--line)}
.hero .logo{font-size:2.6rem;justify-content:center;margin:0 auto}
.hero .ring svg{inset:-8px -10px;width:calc(100% + 20px);height:calc(100% + 16px)}
.hero p.lead{color:var(--muted);margin:14px auto 0;max-width:480px}
.slogan{margin:22px auto 0;max-width:520px;text-align:center;font-weight:600;background:#fff;border:1px dashed #E9B9B4;border-radius:var(--r);padding:12px 16px}
.slogan b{color:var(--red)}
.feat{text-align:right;border:1px solid var(--line);background:#fff;border-radius:var(--r);padding:16px;transition:transform .15s,border-color .15s}
.feat:hover{transform:translateY(-2px);border-color:#CBD2F5}
.feat .ic{font-size:1.6rem;line-height:1}
.feat h3{font-size:1.02rem;margin:8px 0 2px}
.feat p{margin:0;font-size:.88rem;color:var(--muted)}
.namebox{max-width:420px;margin:22px auto 0;text-align:center}
.namebox .row{justify-content:center;margin-top:10px}
.pickname{border:1px solid var(--line);background:#fff;border-radius:999px;padding:3px 12px;font-size:.88rem}

/* runner */
.runhead{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-bottom:12px}
.runhead .count{margin-inline-start:auto;font-size:.88rem;color:var(--muted)}
.lvl{font-size:.82rem;color:var(--muted);letter-spacing:.5px}
.phases{display:flex;gap:6px;margin-bottom:12px}
.ph{flex:1;font-size:.8rem;text-align:center;padding:6px 4px;border-radius:10px;background:#F1EEE6;color:var(--muted);font-weight:600}

.ph.done{background:var(--green-soft);color:var(--green)}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:12px;text-align:center}
.qtext{color:var(--muted);font-weight:500}
.expr{font-size:2rem;font-weight:700;margin-top:2px}
.sheet{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:8px 0;overflow:hidden}
.sheet::before{content:'';position:absolute;top:0;bottom:0;right:46px;width:1.5px;background:#F2C1BC}
.sheet-h{padding:4px 62px 8px 16px;font-size:.84rem;color:var(--muted)}
.step{display:grid;grid-template-columns:46px 1fr;align-items:center;width:100%;text-align:right;background:none;border:0;border-top:1px solid var(--rule);padding:12px 0 12px 16px;position:relative;transition:background .15s,opacity .2s}
.sheet:not(.pick) .step{cursor:default}
.sheet.pick .step:hover{background:#FFFBEA}
.step .num{text-align:center;color:var(--muted);font-weight:600}
.step .body{padding-right:16px}
.step .m{font-size:1.22rem;font-weight:600}
.step .note{display:block;font-size:.84rem;color:var(--muted)}
.step.bad .m{color:var(--red)}
.step.good .num{color:var(--green)}
.step.good .num::after{content:' ✓'}
.step.faded{opacity:.42}
.step .mark{position:absolute;top:6px;bottom:6px;right:52px;left:10px;width:calc(100% - 62px);height:calc(100% - 12px);color:var(--red);pointer-events:none}
.mark path{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .6s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(5px)}50%{transform:translateX(-5px)}75%{transform:translateX(3px)}}
.stage{margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.stage h3{font-size:1.02rem;margin-bottom:10px}
.opts{display:grid;gap:8px}
.opt{text-align:right;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:11px 14px;font-weight:500}
.opt:hover:not(:disabled){border-color:#CBD2F5}
.opt.right{border-color:var(--green);background:var(--green-soft)}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.opt:disabled{cursor:default}
.fb{margin-top:12px;padding:10px 14px;border-radius:12px;font-weight:500}
.fb:empty{display:none}
.fb.good{background:var(--green-soft);color:#1D6B49}
.fb.bad{background:var(--red-soft);color:#A3302A}
.fb.info{background:var(--ind-soft);color:#24318A}
.ans{font-size:1.3rem;padding:9px 14px;border:1.5px solid var(--line);border-radius:12px;width:170px;text-align:center;direction:ltr;background:#fff}
.fixcard{margin-top:12px;border-right:4px solid var(--green);background:#F6FBF8;border-radius:12px;padding:12px 16px}
.fixcard ol{margin:6px 0 8px;padding-right:22px}
.fixcard li{margin:4px 0}
.fixcard li .m{font-weight:600;font-size:1.08rem}
.fixcard .note{color:var(--muted);font-size:.84rem;margin-right:6px}
.next{margin-top:14px}
.float{position:fixed;top:92px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--hl);font-weight:700;padding:6px 18px;border-radius:999px;z-index:50;animation:up 1.1s forwards;pointer-events:none}
@keyframes up{0%{opacity:0;transform:translate(-50%,10px)}20%{opacity:1;transform:translate(-50%,0)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-14px)}}

/* skills picker */
.skill{text-align:right;border:1px solid var(--line);background:#fff;border-radius:var(--r);padding:14px 16px;display:flex;gap:12px;align-items:center}
.skill:hover{border-color:#CBD2F5}
.skill .sym{flex:0 0 46px;height:46px;border-radius:12px;background:var(--ind-soft);color:var(--ind);display:grid;place-items:center;font-weight:700;direction:ltr;font-size:.95rem}
.skill.week .sym{background:#FFF4C2;color:#7A5B00}
.skill b{display:block}
.skill span.small{color:var(--muted)}

/* progress */
.bars{display:grid;gap:12px}
.barrow .lbl{display:flex;justify-content:space-between;font-size:.92rem;margin-bottom:4px}
.track{height:10px;background:#EFECE4;border-radius:99px;overflow:hidden}
.fill{height:100%;border-radius:99px;background:var(--ind);transition:width .6s}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stat b{display:block;font-size:1.5rem;line-height:1.3}
.stat span{font-size:.84rem;color:var(--muted)}
.tag{display:inline-block;font-size:.75rem;font-weight:600;padding:1px 8px;border-radius:999px;margin-right:6px}
.t-good{background:var(--green-soft);color:var(--green)}
.t-mid{background:#FFF4C2;color:#7A5B00}
.t-low{background:var(--red-soft);color:var(--red)}
.t-none{background:#F1EEE6;color:var(--muted)}
.misslist{display:grid;gap:10px}
.miss{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.miss p{margin:2px 0 0;font-size:.86rem;color:var(--muted)}

/* summary */
.summary{text-align:center;padding:28px 18px}
.bigscore{font-size:3rem;font-weight:700;line-height:1.2;margin:8px 0}

/* teacher */
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{padding:8px 6px;border-bottom:1px solid var(--rule);text-align:right}
th{color:var(--muted);font-weight:600;font-size:.82rem}
.tablewrap{overflow-x:auto}
.plist{display:grid;gap:8px}
.pitem{display:flex;gap:10px;justify-content:space-between;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff}
textarea.field{min-height:90px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){
  .expr{font-size:1.6rem}
  .step .m{font-size:1.08rem}
  .two{grid-template-columns:1fr}
  .ph{font-size:.72rem}
  .hero .logo{font-size:2.1rem}
}

const ar=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const strip=x=>x[0]==='('&&x[x.length-1]===')'?x.slice(1,-1):x;
function fm(s){
  let h=esc(String(s).replace(/-/g,'−'));
  h=h.replace(/(\([^()]+\)|[0-9a-zA-Z]+)\/(\([^()]+\)|[0-9a-zA-Z]+)/g,(m,a,b)=>`<span class="fr"><span>${strip(a)}</span><span>${strip(b)}</span></span>`);
  return `<span class="m" dir="ltr">${h}</span>`;
}
function rich(s){return String(s).split('`').map((t,i)=>i%2?fm(t):esc(t)).join('')}
function num(s){
  s=String(s).trim().replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[−–—]/g,'-').replace(/[٫,]/g,'.').replace(/\s/g,'').replace(/^(x|y|س|ص)=/i,'');
  if(/^-?\d+(\.\d+)?\/-?\d+(\.\d+)?$/.test(s)){const[a,b]=s.split('/').map(Number);return b?a/b:NaN}
  return s===''?NaN:Number(s);
}
const RING='<svg class="mark" viewBox="0 0 100 50" preserveAspectRatio="none" aria-hidden="true"><path pathLength="1" d="M10 30 C 6 12, 58 2, 88 13 C 101 21, 92 45, 50 46 C 17 47, 3 37, 14 18"/></svg>';
function newStudent(){return {points:0,stats:{},miss:{},best:0,bestPct:0,runs:0}}
function mastery(st){if(!st)return null;const n=st.sN+st.rN+st.fN;return n?Math.round((st.s+st.r+st.f)/n*100):null}
function rank(p){return p<100?'مصححة مبتدئة 🌱':p<300?'مصححة ماهرة ✏️':'خبيرة التصحيح 🏅'}
function levelTag(v){if(v===null)return '<span class="tag t-none">لم تبدئي بعد</span>';if(v>=80)return '<span class="tag t-good">متقنة</span>';if(v>=50)return '<span class="tag t-mid">في الطريق</span>';return '<span class="tag t-low">تحتاج تدريبًا</span>'}
function barColor(v){return v===null?'#D9D5CB':v>=80?'var(--green)':v>=50?'#E0A800':'var(--red)'}
function floatPts(g){const d=document.createElement('div');d.className='float';d.textContent='+'+ar(g)+' نقطة';document.body.appendChild(d);setTimeout(()=>d.remove(),1150)}

    ${Object.entries(SKILLS).map(([k,v])=>{const n=all.filter(p=>p.skill===k).length;const m=mastery(s.stats[k]);

function startPractice(sk){
  const all=allProblems();let list;
  if(sk==='mix')list=shuffle(all).slice(0,8);
  else if(sk==='week')list=all.filter(p=>p.week);
  else list=all.filter(p=>p.skill===sk);
  list=list.slice().sort((a,b)=>a.level-b.level);
  if(!list.length)return;
  startRun(list,'pr',$('#v-practice'));
}

/* ================= محرك المسألة ================= */
let run=null;
function startRun(list,mode,host){run={list,i:0,mode,host,score:0,max:0,perfect:0};renderProblem()}
function P(){return run.list[run.i]}
function renderProblem(){
  const p=P(),isOK=p.wrong<0;
  run.s={phase:1,stepTries:0,rTries:0,fTries:0,stepFirst:false,rFirst:false,fFirst:false,hint:false};
  run.max+=isOK?15:25;
  run.host.innerHTML=`
  <div class="runhead">
    <button class="btn ghost sm" onclick="show('${run.mode==='ch'?'challenge':'practice'}')">→ رجوع</button>
    <span class="chip">${SKILLS[p.skill].name}</span>${p.week?'<span class="chip week">مسألة الأسبوع</span>':''}
    <span class="lvl">${'●'.repeat(p.level)}${'○'.repeat(3-p.level)} ${LV[p.level]}</span>
    <span class="count">مسألة ${ar(run.i+1)} من ${ar(run.list.length)}${run.mode==='ch'?` · <b>${ar(run.score)}</b> نقطة`:''}</span>
  </div>
  <div class="phases">${['اكتشفي الخطأ','لماذا أخطأت؟','أصلحي الحل'].map((t,i)=>`<div class="ph" data-ph="${i+1}">${ar(i+1)}. ${t}</div>`).join('')}</div>
  <div class="qcard"><div class="qtext">${esc(p.q)}</div><div class="expr">${fm(p.expr)}</div></div>
  <div class="sheet pick" id="sheet">
    <div class="sheet-h">حلّ إحدى الطالبات — افحصيه خطوة خطوة:</div>
    ${p.steps.map((s,i)=>`<button class="step" data-i="${i}"><span class="num">${ar(i+1)}</span><span class="body">${fm(s.m)}${s.n?`<span class="note">${rich(s.n)}</span>`:''}</span></button>`).join('')}
  </div>
  <div class="stage" id="stage"></div>`;
  run.host.querySelectorAll('.step').forEach(b=>b.onclick=()=>pickStep(+b.dataset.i));
  phase1();
}
function setPh(n){document.querySelectorAll('.ph').forEach(e=>{const k=+e.dataset.ph;e.className='ph'+(k<n?' done':k===n?' on':'')})}
function stepEl(i){return run.host.querySelector(`.step[data-i="${i}"]`)}
function award(g){run.score+=g;const s=me();s.points+=g;save();floatPts(g);const h=$('#hpts');if(h)h.textContent=ar(s.points)+' نقطة'}

function phase1(){
  setPh(1);
  $('#stage').innerHTML=`<h3>🔎 أين الخطأ؟</h3>
  <p class="muted small" style="margin:-4px 0 12px">اضغطي على الخطوة التي حدث فيها الخطأ، أو اختاري «الحل صحيح» إن لم تجدي خطأ.</p>
  <button class="btn ghost" id="okBtn">✓ الحل صحيح بالكامل</button>
  <div class="fb" id="fb"></div><div id="nx"></div>`;
  $('#okBtn').onclick=()=>pickStep(-1);
}
function pickStep(i){
  const S=run.s,p=P(),isOK=p.wrong<0;
  if(S.phase!==1)return;
  S.stepTries++;
  const fb=$('#fb');
  if(i===p.wrong){
    S.stepFirst=S.stepTries===1;
    award(isOK?(S.stepFirst?15:7):(S.stepFirst?10:5));
    if(isOK){finishOK(true);return}
    markError();
    fb.className='fb good';fb.innerHTML=`أحسنتِ يا مصححة! 🎯 الخطأ في الخطوة ${ar(p.wrong+1)}.`;
    nextBtn('لماذا حدث الخطأ؟ ←',phase2);
    return;
  }
  if(i>=0){const el=stepEl(i);el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake')}
  fb.className='fb bad';
  fb.innerHTML=i===-1?'يوجد خطأ في إحدى الخطوات… افحصيها بدقة 👀':isOK?'هذه الخطوة صحيحة! تحققي مرة أخرى 👀':'هذه الخطوة صحيحة، الخطأ في مكان آخر.';
  if(S.stepTries>=2){
    if(isOK){finishOK(false);return}
    markError();
    fb.className='fb info';fb.innerHTML=`لا بأس، الخطأ كان في الخطوة ${ar(p.wrong+1)} (محاطة بالأحمر). لنفهم سببه.`;
    nextBtn('لماذا حدث الخطأ؟ ←',phase2);
  }
}
function markError(){
  const p=P();run.s.phase=1.5;$('#sheet').classList.remove('pick');
  const el=stepEl(p.wrong);el.classList.add('bad');el.insertAdjacentHTML('beforeend',RING);
  p.steps.forEach((_,j)=>{if(j>p.wrong)stepEl(j).classList.add('faded')});
  const ok=$('#okBtn');if(ok)ok.disabled=true;
}
function nextBtn(label,fn){$('#nx').innerHTML=`<button class="btn next">${label}</button>`;$('#nx button').onclick=fn}

function finishOK(found){
  const p=P();run.s.phase=4;$('#sheet').classList.remove('pick');
  run.host.querySelectorAll('.step').forEach(e=>e.classList.add('good'));
  setPh(4);
  $('#stage').innerHTML=`<div class="fb ${found?'good':'info'}" style="margin-top:0">${found?'ممتاز! 👏 لاحظتِ أن الحل صحيح، والتحقق مهارة مهمة مثل اكتشاف الخطأ.':'هذا الحل كان صحيحًا بالكامل ✓ — أحيانًا يكون التحقق هو المطلوب.'}</div>
  <div class="fixcard"><b>لماذا الحل صحيح؟</b><p style="margin:4px 0 0">${rich(p.explain)}</p></div>
  <div id="nx"></div>`;
  record();endBtn();
}

function phase2(){
  const p=P(),S=run.s;S.phase=2;setPh(2);
  const opts=shuffle([p.reason,...shuffle(Object.keys(REASONS).filter(r=>r!==p.reason)).slice(0,3)]);
  $('#stage').innerHTML=`<h3>💭 لماذا حدث الخطأ في الخطوة ${ar(p.wrong+1)}؟</h3>
  <div class="opts">${opts.map(r=>`<button class="opt" data-r="${r}">${REASONS[r]}</button>`).join('')}</div>
  <div class="fb" id="fb"></div><div id="nx"></div>`;
  $('#stage').querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    if(S.phase!==2)return;S.rTries++;
    const fb=$('#fb');
    if(b.dataset.r===p.reason){
      S.rFirst=S.rTries===1;award(S.rFirst?5:2);b.classList.add('right');
      done2(fb,'صحيح! ✔️');
    }else{
      b.classList.add('wrong');b.disabled=true;
      if(S.rTries>=2){$(`.opt[data-r="${p.reason}"]`).classList.add('right');done2(fb,'السبب الصحيح موضّح بالأخضر.')}
      else{fb.className='fb bad';fb.textContent='ليس هذا هو السبب، جرّبي مرة أخرى.'}
    }
  });
}
function done2(fb,head){
  const p=P();run.s.phase=2.5;
  $('#stage').querySelectorAll('.opt').forEach(o=>o.disabled=true);
  fb.className='fb good';fb.innerHTML=`${head} <span style="font-weight:400">${esc(TIPS[p.reason])}</span>`;
  nextBtn('أصلحي الحل ←',phase3);
}

function phase3(){
  const p=P(),S=run.s;S.phase=3;setPh(3);
  $('#stage').innerHTML=`<h3>✏️ أصلحي الحل</h3>
  <p class="muted small" style="margin:-4px 0 12px">أعيدي حل المسألة بطريقة صحيحة في دفترك، ثم اكتبي الناتج النهائي هنا (يمكنك كتابة الكسر هكذا: 3/4).</p>
  <div class="row"><input class="ans" id="ans" inputmode="text" autocomplete="off" placeholder="الناتج"><button class="btn" id="chk">تحقّقي</button>
  ${p.fix.length?'<button class="btn ghost sm" id="hint">💡 تلميح</button>':''}</div>
  <div class="fb" id="fb"></div><div id="nx"></div>`;
  const inp=$('#ans');inp.focus();
  const check=()=>{
    if(S.phase!==3)return;
    const v=num(inp.value),fb=$('#fb');
    if(isNaN(v)){fb.className='fb bad';fb.textContent='اكتبي عددًا أو كسرًا مثل 5 أو −4 أو 3/2.';return}
    S.fTries++;
    if(Math.abs(v-num(p.answer))<1e-6){S.fFirst=S.fTries===1&&!S.hint;award(S.fFirst?10:5);done3(true)}
    else if(S.fTries>=2)done3(false);
    else{fb.className='fb bad';fb.textContent='الناتج غير صحيح، راجعي حلّك وجرّبي مرة أخرى.';inp.select()}
  };
  $('#chk').onclick=check;inp.onkeydown=e=>{if(e.key==='Enter')check()};
  const h=$('#hint');if(h)h.onclick=()=>{S.hint=true;h.disabled=true;const fb=$('#fb');fb.className='fb info';fb.innerHTML='ابدئي هكذا: '+fm(p.fix[0].m)+(p.fix[0].n?' — '+rich(p.fix[0].n):'')};
}
function done3(ok){
  const p=P();run.s.phase=4;setPh(4);
  $('#chk').disabled=true;$('#ans').disabled=true;const h=$('#hint');if(h)h.disabled=true;
  const fb=$('#fb');fb.className='fb '+(ok?'good':'info');
  fb.innerHTML=ok?'رائع! 🌟 أصلحتِ الحل بنجاح.':'الناتج الصحيح هو '+fm(p.answer)+' — راجعي الخطوات بالأسفل.';
  $('#nx').insertAdjacentHTML('beforebegin',`<div class="fixcard"><b>الحل الصحيح</b><ol>${p.fix.map(f=>`<li>${fm(f.m)}${f.n?`<span class="note">${rich(f.n)}</span>`:''}</li>`).join('')}</ol><div>💡 ${rich(p.explain)}</div></div>`);
  record();endBtn();
}

function record(){
  const p=P(),S=run.s,s=me(),isOK=p.wrong<0;
  const st=s.stats[p.skill]||(s.stats[p.skill]={sN:0,s:0,rN:0,r:0,fN:0,f:0});
  st.sN++;if(S.stepFirst)st.s++;
  let perfect=S.stepFirst;
  if(!isOK){st.rN++;st.fN++;if(S.rFirst)st.r++;if(S.fFirst)st.f++;perfect=S.stepFirst&&S.rFirst&&S.fFirst;if(!perfect)s.miss[p.reason]=(s.miss[p.reason]||0)+1}
  if(perfect)run.perfect++;
  const pr=DB.prob[p.id]||(DB.prob[p.id]={n:0,fail:0});pr.n++;if(!perfect)pr.fail++;
  save();
}
function endBtn(){
  const last=run.i>=run.list.length-1;
  nextBtn(last?'عرض النتيجة 🏁':'المسألة التالية ←',()=>{run.i++;if(run.i<run.list.length){renderProblem();window.scrollTo(0,0)}else summary()});
}
function summary(){
  const s=me(),pct=run.max?Math.round(run.score/run.max*100):0;
  s.runs++;
  if(run.mode==='ch'&&run.score>s.best){s.best=run.score;s.bestPct=pct}
  save();
  const msg=pct>=85?'دقة عالية! أنتِ مصححة محترفة 🏅':pct>=60?'أداء جميل، وكل خطأ اكتشفتِه خطوة نحو الإتقان ✨':'بداية جيدة! راجعي خريطة تقدمك لتعرفي أين تتدربين 💪';
  run.host.innerHTML=`<div class="card summary">
    <div class="muted">${run.mode==='ch'?'نتيجة تحدي الدقة':'انتهى المسار'}</div>
    <div class="bigscore">${ar(run.score)}<span class="muted" style="font-size:1.2rem"> / ${ar(run.max)}</span></div>
    <div class="stats" style="max-width:420px;margin:12px auto;text-align:right">
      <div class="stat"><b>${ar(pct)}٪</b><span>نسبة الدقة</span></div>
      <div class="stat"><b>${ar(run.perfect)} / ${ar(run.list.length)}</b><span>مسائل بلا أي تعثّر</span></div>
    </div>
    <p style="font-weight:600">${msg}</p>
    <div class="slogan" style="margin-top:12px">«<b>الخطأ</b> فرصة للفهم، والتصحيح طريق للإتقان»</div>
    <div class="row" style="justify-content:center;margin-top:18px">
      <button class="btn" onclick="show('${run.mode==='ch'?'challenge':'practice'}')">${run.mode==='ch'?'تحدٍّ جديد':'مسار آخر'}</button>
      <button class="btn ghost" onclick="show('progress')">خريطة تقدمي 📊</button>
    </div></div>`;
  window.scrollTo(0,0);
}

/* ================= خريطة تقدمي ================= */
function renderProgress(){
  const host=$('#v-progress');if(needName(host))return;
  const s=me();
  const tot={sN:0,s:0,rN:0,r:0,fN:0,f:0};Object.values(s.stats).forEach(st=>Object.keys(tot).forEach(k=>tot[k]+=st[k]));
  const overall=mastery(tot);
  const mastered=Object.keys(SKILLS).filter(k=>{const m=mastery(s.stats[k]);return m!==null&&m>=80&&s.stats[k].sN>=2});
  const misses=Object.entries(s.miss).sort((a,b)=>b[1]-a[1]).slice(0,3);
  host.innerHTML=`
  <h1 style="font-size:1.4rem">خريطة تقدمي 📊</h1>
  <p class="muted" style="margin:4px 0 16px">${esc(DB.cur)} · ${rank(s.points)}</p>
  <div class="stats">
    <div class="stat"><b>${ar(s.points)}</b><span>مجموع النقاط</span></div>
    <div class="stat"><b>${ar(tot.sN)}</b><span>مسائل صحّحتِها</span></div>
    <div class="stat"><b>${overall===null?'—':ar(overall)+'٪'}</b><span>الإتقان العام</span></div>
    <div class="stat"><b>${s.best?ar(s.best):'—'}</b><span>أفضل نتيجة في التحدي</span></div>
  </div>
  <div class="sec-title"><h2>مهاراتي</h2></div>
  <div class="card bars">${Object.entries(SKILLS).map(([k,v])=>{const m=mastery(s.stats[k]);
    return `<div class="barrow"><div class="lbl"><span>${v.name} ${levelTag(m)}</span><span class="muted">${m===null?'':ar(m)+'٪'}</span></div><div class="track"><div class="fill" style="width:${m||0}%;background:${barColor(m)}"></div></div></div>`}).join('')}</div>
  ${mastered.length?`<div class="sec-title"><h2>أتقنتِ 🎖️</h2></div><div class="row">${mastered.map(k=>`<span class="tag t-good" style="font-size:.9rem;padding:4px 12px">${SKILLS[k].name}</span>`).join('')}</div>`:''}
  <div class="sec-title"><h2>أخطاء تحتاج انتباهك</h2></div>
  ${misses.length?`<div class="misslist">${misses.map(([r,c])=>`<div class="miss"><div><b>${REASONS[r]}</b> <span class="tag t-low">${ar(c)} مرات</span><p>${esc(TIPS[r])}</p></div><button class="btn sm" data-sk="${REASON_SKILL[r]}">تدرّبي</button></div>`).join('')}</div>`
    :`<div class="card muted">لا توجد أخطاء متكررة بعد — ابدئي التصحيح لتظهر هنا.</div>`}`;
  host.querySelectorAll('[data-sk]').forEach(b=>b.onclick=()=>{show('practice');startPractice(b.dataset.sk)});
}

/* ================= لوحة المعلمة ================= */
function renderTeacher(){
  const host=$('#v-teacher');
  if(!teacherOK){
    host.innerHTML=`<div class="card namebox"><h2>لوحة المعلمة 👩‍🏫</h2><p class="muted small">أدخلي الرمز للمتابعة.</p>
    <div class="row"><input class="field" id="pin" type="password" inputmode="numeric" placeholder="الرمز" style="max-width:160px;text-align:center"><button class="btn" id="pinGo">دخول</button></div><div class="fb" id="pfb"></div></div>`;
    const go=()=>{if($('#pin').value===DB.pin){teacherOK=true;renderTeacher()}else{$('#pfb').className='fb bad';$('#pfb').textContent='الرمز غير صحيح.'}};
    $('#pinGo').onclick=go;$('#pin').onkeydown=e=>{if(e.key==='Enter')go()};return;
  }
  const studs=Object.entries(DB.students);
  const agg={},missAll={};let solved=0;
  studs.forEach(([,s])=>{
    Object.entries(s.stats).forEach(([k,st])=>{const a=agg[k]||(agg[k]={sN:0,s:0,rN:0,r:0,fN:0,f:0});Object.keys(a).forEach(x=>a[x]+=st[x]);solved+=st.sN});
    Object.entries(s.miss).forEach(([r,c])=>missAll[r]=(missAll[r]||0)+c);
  });
  const tot={sN:0,s:0,rN:0,r:0,fN:0,f:0};Object.values(agg).forEach(st=>Object.keys(tot).forEach(k=>tot[k]+=st[k]));
  const missSorted=Object.entries(missAll).sort((a,b)=>b[1]-a[1]);const maxMiss=missSorted.length?missSorted[0][1]:1;
  const byId={};allProblems().forEach(p=>byId[p.id]=p);
  const hard=Object.entries(DB.prob).filter(([id,v])=>byId[id]&&v.n>0).map(([id,v])=>({p:byId[id],rate:Math.round(v.fail/v.n*100),n:v.n})).sort((a,b)=>b.rate-a.rate).slice(0,5);
  host.innerHTML=`
  <div class="row" style="justify-content:space-between"><h1 style="font-size:1.4rem">لوحة المعلمة 👩‍🏫</h1><button class="btn ghost sm" onclick="teacherOK=false;show('home')">خروج</button></div>
  <p class="muted small" style="margin:4px 0 16px">البيانات المعروضة محفوظة على هذا الجهاز.</p>
  <div class="stats">
    <div class="stat"><b>${ar(studs.length)}</b><span>طالبة</span></div>
    <div class="stat"><b>${ar(solved)}</b><span>مسألة مصحّحة</span></div>
    <div class="stat"><b>${mastery(tot)===null?'—':ar(mastery(tot))+'٪'}</b><span>متوسط الإتقان</span></div>
    <div class="stat"><b>${ar(allProblems().length)}</b><span>مسألة في المنصة</span></div>
  </div>

  <div class="sec-title"><h2>الأخطاء الشائعة لدى الطالبات</h2></div>
  <div class="card bars">${missSorted.length?missSorted.map(([r,c])=>`<div class="barrow"><div class="lbl"><span>${REASONS[r]}</span><span class="muted">${ar(c)}</span></div><div class="track"><div class="fill" style="width:${Math.round(c/maxMiss*100)}%;background:var(--red)"></div></div></div>`).join(''):'<span class="muted">لا توجد بيانات بعد.</span>'}</div>

  <div class="sec-title"><h2>الإتقان حسب المهارة</h2></div>
  <div class="card bars">${Object.entries(SKILLS).map(([k,v])=>{const m=mastery(agg[k]);return `<div class="barrow"><div class="lbl"><span>${v.name} ${levelTag(m)}</span><span class="muted">${m===null?'':ar(m)+'٪'}</span></div><div class="track"><div class="fill" style="width:${m||0}%;background:${barColor(m)}"></div></div></div>`}).join('')}</div>

  <div class="sec-title"><h2>أصعب المسائل</h2></div>
  <div class="card">${hard.length?`<div class="tablewrap"><table><tr><th>المسألة</th><th>المهارة</th><th>نسبة التعثّر</th></tr>${hard.map(h=>`<tr><td>${fm(h.p.expr)}</td><td>${SKILLS[h.p.skill].name}</td><td>${ar(h.rate)}٪ <span class="muted small">(${ar(h.n)} محاولة)</span></td></tr>`).join('')}</table></div>`:'<span class="muted">لا توجد بيانات بعد.</span>'}</div>

  <div class="sec-title"><h2>الطالبات</h2><button class="btn ghost sm" id="csv">تصدير النتائج CSV</button></div>
  <div class="card">${studs.length?`<div class="tablewrap"><table><tr><th>الاسم</th><th>النقاط</th><th>مسائل</th><th>الإتقان</th><th>أكثر خطأ</th></tr>${studs.map(([n,s])=>{const t={sN:0,s:0,rN:0,r:0,fN:0,f:0};Object.values(s.stats).forEach(st=>Object.keys(t).forEach(k=>t[k]+=st[k]));const top=Object.entries(s.miss).sort((a,b)=>b[1]-a[1])[0];const m=mastery(t);
    return `<tr><td>${esc(n)}</td><td>${ar(s.points)}</td><td>${ar(t.sN)}</td><td>${m===null?'—':ar(m)+'٪'}</td><td class="small">${top?REASONS[top[0]]:'—'}</td></tr>`}).join('')}</table></div>`:'<span class="muted">لم تسجّل أي طالبة بعد.</span>'}</div>

  <div class="sec-title"><h2>إضافة مسألة الأسبوع ⭐</h2></div>
  <div class="card">
    <div class="two">
      <div><label class="lb">المهارة</label><select class="field" id="f-skill">${Object.entries(SKILLS).map(([k,v])=>`<option value="${k}">${v.name}</option>`).join('')}</select></div>
      <div><label class="lb">المستوى</label><select class="field" id="f-level"><option value="1">سهل</option><option value="2">متوسط</option><option value="3">صعب</option></select></div>
    </div>
    <div class="two">
      <div><label class="lb">نص السؤال</label><input class="field" id="f-q" value="احسبي:"></div>
      <div><label class="lb">المسألة (رياضيًا)</label><input class="field" id="f-expr" dir="ltr" placeholder="3 × (4 − 6)"></div>
    </div>
    <label class="lb">خطوات الحل كما كتبتها الطالبة (كل خطوة في سطر، ويمكن إضافة ملاحظة بعد علامة | )</label>
    <textarea class="field" id="f-steps" dir="ltr" placeholder="4 − 6 = 2 | الأقواس أولًا&#10;3 × 2 = 6"></textarea>
    <div class="two">
      <div><label class="lb">رقم الخطوة الخاطئة (٠ = الحل صحيح)</label><input class="field" id="f-wrong" type="number" min="0" value="1"></div>
      <div><label class="lb">سبب الخطأ</label><select class="field" id="f-reason">${Object.entries(REASONS).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div>
    </div>
    <div class="two">
      <div><label class="lb">الناتج الصحيح</label><input class="field" id="f-ans" dir="ltr" placeholder="-6 أو 3/4"></div>
      <div></div>
    </div>
    <label class="lb">خطوات الحل الصحيح (كل خطوة في سطر، والملاحظة بعد | )</label>
    <textarea class="field" id="f-fix" dir="ltr" placeholder="4 − 6 = −2 | طرح عدد أكبر من أصغر&#10;3 × (−2) = −6"></textarea>
    <label class="lb">شرح مبسّط</label>
    <input class="field" id="f-exp" placeholder="مثال: عند طرح عدد أكبر من عدد أصغر يكون الناتج سالبًا.">
    <div class="row" style="margin-top:14px"><button class="btn" id="addP">إضافة المسألة</button></div>
    <div class="fb" id="afb"></div>
  </div>

  <div class="sec-title"><h2>مسائل الأسبوع الحالية</h2></div>
  <div class="plist">${DB.custom.length?DB.custom.map((p,i)=>`<div class="pitem"><div>${fm(p.expr)} <span class="chip">${SKILLS[p.skill].name}</span> <span class="small muted">${LV[p.level]}</span></div><button class="btn ghost sm" data-del="${i}">حذف</button></div>`).join(''):'<div class="card muted">لم تُضف مسائل هذا الأسبوع بعد.</div>'}</div>
  <div class="card" style="margin-top:12px">
    <b>نقل المسائل لأجهزة أخرى</b>
    <p class="small muted" style="margin:4px 0 10px">صدّري المسائل ثم استوردِيها في جهاز آخر، أو الصقيها داخل الملف في <span class="m">WEEKLY</span> لتظهر لكل الطالبات.</p>
    <textarea class="field" id="io" dir="ltr" placeholder="[ ... ]"></textarea>
    <div class="row" style="margin-top:10px"><button class="btn ghost sm" id="exp">تصدير</button><button class="btn ghost sm" id="imp">استيراد</button></div>
    <div class="fb" id="iofb"></div>
  </div>

  <div class="sec-title"><h2>الإعدادات</h2></div>
  <div class="card">
    <div class="row"><input class="field" id="newpin" type="password" inputmode="numeric" placeholder="رمز جديد" style="max-width:160px"><button class="btn ghost sm" id="setpin">تغيير الرمز</button>
    <button class="btn ghost sm" id="wipe" style="color:var(--red);border-color:#F2C1BC">مسح بيانات الطالبات</button></div>
    <div class="fb" id="sfb"></div>
  </div>`;

  host.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(confirm('حذف هذه المسألة؟')){DB.custom.splice(+b.dataset.del,1);save();renderTeacher()}});
  $('#addP').onclick=addProblem;
  $('#exp').onclick=()=>{$('#io').value=JSON.stringify(DB.custom,null,1);$('#io').select();try{navigator.clipboard.writeText($('#io').value)}catch(e){}$('#iofb').className='fb good';$('#iofb').textContent='تم التصدير ونسخه.'};
  $('#imp').onclick=()=>{try{const a=JSON.parse($('#io').value);if(!Array.isArray(a))throw 0;const ok=a.filter(p=>p&&p.expr&&Array.isArray(p.steps)&&SKILLS[p.skill]&&REASONS[p.reason]);ok.forEach(p=>{if(!DB.custom.some(c=>c.id===p.id))DB.custom.push(p)});save();renderTeacher()}catch(e){$('#iofb').className='fb bad';$('#iofb').textContent='النص غير صالح.'}};
  $('#csv').onclick=exportCSV;
  $('#setpin').onclick=()=>{const v=$('#newpin').value.trim();if(v.length<4){$('#sfb').className='fb bad';$('#sfb').textContent='الرمز ٤ خانات على الأقل.';return}DB.pin=v;save();$('#sfb').className='fb good';$('#sfb').textContent='تم تغيير الرمز.'};
  $('#wipe').onclick=()=>{if(confirm('سيتم حذف كل نقاط الطالبات وإحصاءاتهن على هذا الجهاز. متأكدة؟')){DB.students={};DB.prob={};DB.cur=null;save();renderTeacher();renderWho()}};
}
function parseLines(t){return t.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{const[m,...n]=l.split('|');return {m:m.trim(),n:n.join('|').trim()}})}
function addProblem(){
  const fb=$('#afb'),err=t=>{fb.className='fb bad';fb.textContent=t};
  const expr=$('#f-expr').value.trim(),steps=parseLines($('#f-steps').value),w=parseInt($('#f-wrong').value,10),ans=$('#f-ans').value.trim(),fix=parseLines($('#f-fix').value);
  if(!expr)return err('اكتبي المسألة.');
  if(steps.length<2)return err('أضيفي خطوتين على الأقل.');
  if(isNaN(w)||w<0||w>steps.length)return err('رقم الخطوة الخاطئة غير صحيح.');
  if(isNaN(num(ans)))return err('اكتبي الناتج الصحيح عددًا أو كسرًا.');
  if(w>0&&!fix.length)return err('أضيفي خطوات الحل الصحيح.');
  DB.custom.push({id:'c'+Date.now(),skill:$('#f-skill').value,level:+$('#f-level').value,q:$('#f-q').value.trim()||'احسبي:',expr,steps,wrong:w-1,reason:$('#f-reason').value,answer:ans.replace(/−/g,'-'),fix,explain:$('#f-exp').value.trim()||TIPS[$('#f-reason').value]});
  save();renderTeacher();
}
function exportCSV(){
  const rows=[['الاسم','النقاط','المسائل','الإتقان %','أفضل نتيجة تحدي',...Object.values(SKILLS).map(s=>s.name+' %')]];
  Object.entries(DB.students).forEach(([n,s])=>{const t={sN:0,s:0,rN:0,r:0,fN:0,f:0};Object.values(s.stats).forEach(st=>Object.keys(t).forEach(k=>t[k]+=st[k]));
    rows.push([n,s.points,t.sN,mastery(t)??'',s.best,...Object.keys(SKILLS).map(k=>mastery(s.stats[k])??'')])});
  const csv='\uFEFF'+rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='wain-ghalatt-results.csv';a.click();
}

show('home');
</script>
</body>
</html>
